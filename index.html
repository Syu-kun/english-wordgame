<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工業高校 英単語25チャレンジ</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0; font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;
    background:linear-gradient(135deg,#eef5ff,#f8f5ff);
    color:#172033; min-height:100vh;
  }
  .wrap{max-width:720px;margin:auto;padding:22px 16px 40px}
  .card{
    background:#fff;border-radius:24px;padding:24px;
    box-shadow:0 10px 35px rgba(35,55,90,.12);
  }
  h1{margin:0 0 6px;font-size:clamp(25px,6vw,38px)}
  .sub{margin:0 0 20px;color:#687386}
  .top{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:18px}
  .pill{background:#f0f4fa;border-radius:999px;padding:8px 13px;font-weight:700}
  .bar{height:9px;background:#e9edf4;border-radius:99px;overflow:hidden;margin:10px 0 22px}
  #progress{height:100%;width:0%;background:#5b72e8;transition:.3s}
  .qtag{font-size:14px;color:#69758a;font-weight:700}
  .question{
    min-height:135px;display:flex;align-items:center;justify-content:center;
    text-align:center;font-size:clamp(30px,8vw,52px);font-weight:800;
    padding:10px;letter-spacing:.02em;
  }
  .jp{font-size:clamp(25px,6vw,38px)}
  .choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
  button{
    border:0;border-radius:16px;padding:16px 12px;font-size:17px;font-weight:750;
    background:#edf2ff;color:#25366f;cursor:pointer;transition:.15s;
  }
  button:hover{transform:translateY(-1px);filter:brightness(.98)}
  button:disabled{cursor:default;transform:none}
  .correct{background:#dff7e8!important;color:#16723a!important}
  .wrong{background:#ffe2e2!important;color:#a72a2a!important}
  .answer{margin-top:16px;padding:14px 16px;border-radius:15px;background:#f6f7fa;display:none}
  .answer strong{font-size:20px}
  .next{width:100%;margin-top:12px;background:#172033;color:white}
  .hidden{display:none}
  .start button,.result button{width:100%;background:#172033;color:#fff;margin-top:12px}
  .mode{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}
  .mode button{background:#f0f3f8;color:#303b50}
  .mode button.selected{background:#dfe6ff;color:#263a96;outline:3px solid #bfcaff}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
  .stat{background:#f5f7fb;border-radius:16px;padding:14px;text-align:center}
  .stat b{display:block;font-size:25px}
  .tiny{font-size:13px;color:#738097}
  .review{text-align:left;margin-top:20px}
  .review-item{padding:11px 0;border-bottom:1px solid #e9edf3}
  .review-item b{display:inline-block;min-width:75px}
  @media(max-width:520px){.choices{grid-template-columns:1fr}.card{padding:18px}.question{min-height:115px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <section id="start" class="start">
      <h1>⚡ 工業高校 英単語25チャレンジ</h1>
      <p class="sub">写真の単語から毎回ランダムで25問！4択でテンポよく覚えよう。</p>
      <div class="mode">
        <button id="modeJP" class="selected" onclick="setMode('jp')">日本語 → 英語</button>
        <button id="modeEN" onclick="setMode('en')">英語 → 日本語</button>
      </div>
      <p class="tiny">出題：写真に書かれていた工業・数学・日常系の英単語 約50語</p>
      <button onclick="startGame()">▶ ゲーム開始！</button>
    </section>

    <section id="game" class="hidden">
      <div class="top">
        <div class="pill" id="count">1 / 25</div>
        <div class="pill">🔥 <span id="streak">0</span> 連続</div>
        <div class="pill">⭐ <span id="score">0</span></div>
      </div>
      <div class="bar"><div id="progress"></div></div>
      <div class="qtag" id="qtag">この日本語は英語で？</div>
      <div class="question" id="question"></div>
      <div class="choices" id="choices"></div>
      <div class="answer" id="answer"></div>
      <button class="next hidden" id="next" onclick="nextQuestion()">次の問題 →</button>
    </section>

    <section id="result" class="result hidden">
      <h1>🎉 25問終了！</h1>
      <p id="resultMsg"></p>
      <div class="stats">
        <div class="stat"><span class="tiny">正解</span><b id="finalCorrect">0</b></div>
        <div class="stat"><span class="tiny">正答率</span><b id="finalRate">0%</b></div>
        <div class="stat"><span class="tiny">最高連続</span><b id="finalStreak">0</b></div>
      </div>
      <button onclick="startGame()">🔄 もう一度（問題をシャッフル）</button>
      <button onclick="showStart()" style="background:#edf2ff;color:#26324a">モード選択へ</button>
      <div class="review" id="review"></div>
    </section>
  </div>
</div>

<script>
const WORDS = [
 ["bar graph","棒グラフ"],["bend","曲げる"],["circle","円（図形）"],["clockwise","時計回りの"],
 ["cloudy","曇りの"],["cone","円錐"],["cube","立方体"],["cubed","3乗"],
 ["diameter","直径"],["east","東"],["equal to","〜に等しい"],["five to seven","7時5分前"],
 ["greater than","〜より大きい"],["half","半分の"],["helmet","ヘルメット"],["hit","叩く"],
 ["length","長さ"],["less than","〜より小さい"],["line graph","折れ線グラフ"],["loosen","緩める"],
 ["mask","マスク"],["material","物質"],["measure","計測する"],["nail","釘"],
 ["next to","〜の隣に"],["north","北"],["nut","ナット"],["on","上に"],
 ["parallel","平行の"],["pie graph","円グラフ"],["pincers","ペンチ"],["pull","引っ張る"],
 ["radius","半径"],["rainy","雨の"],["right angle","直角"],["safety glasses","安全メガネ"],
 ["screw","ネジ"],["screwdriver","ドライバー"],["shape","成形する"],["south","南"],
 ["spanner","スパナ"],["squared","〜の2乗"],["sunny","晴れの"],["Thursday","木曜日"],
 ["tool","道具"],["Tuesday","火曜日"],["turn","回転する"],["twist","ねじる"],
 ["volume","体積"],["west","西"]
];

let mode="jp", quiz=[], index=0, score=0, streak=0, best=0, correct=0, mistakes=[];

function setMode(m){
  mode=m;
  document.getElementById("modeJP").classList.toggle("selected",m==="jp");
  document.getElementById("modeEN").classList.toggle("selected",m==="en");
}
function shuffle(a){return [...a].sort(()=>Math.random()-0.5)}
function startGame(){
  quiz=shuffle(WORDS).slice(0,25); index=0; score=0; streak=0; best=0; correct=0; mistakes=[];
  document.getElementById("start").classList.add("hidden");
  document.getElementById("result").classList.add("hidden");
  document.getElementById("game").classList.remove("hidden");
  showQuestion();
}
function showQuestion(){
  const [en,jp]=quiz[index];
  document.getElementById("count").textContent=`${index+1} / 25`;
  document.getElementById("score").textContent=score;
  document.getElementById("streak").textContent=streak;
  document.getElementById("progress").style.width=((index)/25*100)+"%";
  document.getElementById("qtag").textContent=mode==="jp" ? "この日本語は英語で？" : "この英語は日本語で？";
  const q=document.getElementById("question");
  q.textContent=mode==="jp"?jp:en;
  q.className="question "+(mode==="jp"?"jp":"");
  const answerValue=mode==="jp"?en:jp;
  const pool=WORDS.filter(w=>w!==quiz[index]).map(w=>mode==="jp"?w[0]:w[1]);
  const choices=shuffle([answerValue,...shuffle(pool).slice(0,3)]);
  const box=document.getElementById("choices"); box.innerHTML="";
  choices.forEach(c=>{
    const b=document.createElement("button"); b.textContent=c;
    b.onclick=()=>answer(b,c===answerValue,answerValue);
    box.appendChild(b);
  });
  document.getElementById("answer").style.display="none";
  document.getElementById("next").classList.add("hidden");
}
function answer(btn,isCorrect,answerValue){
  const buttons=[...document.querySelectorAll("#choices button")];
  buttons.forEach(b=>b.disabled=true);
  if(isCorrect){
    btn.classList.add("correct"); correct++; streak++; best=Math.max(best,streak);
    score+=100+Math.max(0,streak-1)*20;
    document.getElementById("answer").innerHTML="⭕ <strong>正解！</strong> +"+(100+Math.max(0,streak-1)*20)+"点";
  }else{
    btn.classList.add("wrong"); streak=0;
    buttons.find(b=>b.textContent===answerValue)?.classList.add("correct");
    const [en,jp]=quiz[index];
    mistakes.push([en,jp]);
    document.getElementById("answer").innerHTML=`❌ <strong>おしい！</strong> 正解は <strong>${answerValue}</strong>`;
  }
  document.getElementById("answer").style.display="block";
  document.getElementById("score").textContent=score;
  document.getElementById("streak").textContent=streak;
  document.getElementById("next").classList.remove("hidden");
  document.getElementById("progress").style.width=((index+1)/25*100)+"%";
}
function nextQuestion(){
  index++;
  if(index>=25) finish(); else showQuestion();
}
function finish(){
  document.getElementById("game").classList.add("hidden");
  document.getElementById("result").classList.remove("hidden");
  const rate=Math.round(correct/25*100);
  document.getElementById("finalCorrect").textContent=correct+"/25";
  document.getElementById("finalRate").textContent=rate+"%";
  document.getElementById("finalStreak").textContent=best;
  document.getElementById("resultMsg").textContent=
    rate>=90?"🌟 すごい！かなり定着してる！":
    rate>=70?"👍 いい感じ！間違えた単語を復習すればさらに強い！":
    "💪 まずは間違えた単語を復習して、もう一周してみよう！";
  const r=document.getElementById("review");
  r.innerHTML=mistakes.length
    ? "<h3>📖 復習リスト</h3>"+mistakes.map(x=>`<div class="review-item"><b>${x[0]}</b> → ${x[1]}</div>`).join("")
    : "<h3>🏆 全問正解！</h3><p>完璧です！</p>";
}
function showStart(){
  document.getElementById("result").classList.add("hidden");
  document.getElementById("start").classList.remove("hidden");
}
</script>
</body>
</html>
